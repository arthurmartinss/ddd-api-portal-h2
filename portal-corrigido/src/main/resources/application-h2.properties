spring.application.name=portal

#Banco H2: É um banco relacional local (ou embutido) na aplicação
# Muito comum para testes, mvps ou projetos educacionais

#onde esta o o banco de dados
spring.datasource.url=jdbc:h2:mem:portal

#onde esta o driver do JDBC
spring.datasource.driver-class-name=org.h2.Driver

#quem é o usuario e a senha
spring.datasource.username=admin
spring.datasource.password=admin


#JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
# Por que update? Quando a classe modelo é criado ou modificada a tabela também atualizada


#habilitar a exibição do SQL no terminal
spring.jpa.show-sql=true

#Formatando o SQL no terminal
spring.jpa.properties.hibernate.format_sql=true

#Habilitar o Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


server.port=8081
